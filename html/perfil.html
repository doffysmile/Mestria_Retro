<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestria - Meu perfil</title>
   <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <h1>Mestria</h1>
    <h2 id="boasVindas"></h2>
    <nav>
        <a href="aulas.html"><img src="../img/user_aulas.png" alt="" aria-hidden="true">Aulas</a>
        <a href="matriculas.html"><img src="../img/user_calendar-0.png" alt="" aria-hidden="true">Minhas matrículas</a>
    </nav>
    <h2>Meu perfil</h2>

    <form id="formPerfil">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
        <br>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf">
        <br>
        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" name="telefone">
        <br>
        <button type="submit">Salvar alterações</button>
        <button type="button" id="excluirConta">Excluir minha conta</button>
    </form>

    <p id="mensagem"></p>
    <script src="../js/sessao.js"></script>
    <script src="../js/perfil.js"></script>
</body>
</html>
