<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestria - Cadastrar aula</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <h1>Mestria</h1>
    <h2 id="boasVindas"></h2>
    <nav>
        <a href="aulas.html"><img src="../img/user_aulas.png" alt="" aria-hidden="true">Aulas</a>
        <a href="matriculas.html"><img src="../img/user_calendar-0.png" alt="" aria-hidden="true">Minhas matrículas</a>
        <a href="perfil.html"><img src="../img/rnaserv_101-0.png" alt="" aria-hidden="true">Meu perfil</a>
    </nav>
    <h2>Cadastrar aula</h2>

    <form id="formAula">
        <input type="hidden" name="operacao" value="cadastrar">
        <label for="nome">Nome da aula:</label>
        <input type="text" id="nome" name="nome" required>
        <br>
        <label for="horario">Horário:</label>
        <input type="time" id="horario" name="horario" required>
        <br>
        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" name="assunto" required>
        <br>
        <label for="valor">Valor:</label>
        <input type="number" id="valor" name="valor" min="0" step="0.01" required>
        <br>
        <label for="data_aula">Data da aula:</label>
        <input type="date" id="data_aula" name="data_aula" required>
        <br>
        <label for="capacidade">Capacidade:</label>
        <input type="number" id="capacidade" name="capacidade" min="1" required>
        <br>
        <button type="submit">Cadastrar aula</button>
    </form>

    <p id="mensagem"></p>
    <script src="../js/sessao.js"></script>
    <script src="../js/cadastro_aula.js"></script>
</body>
</html>
